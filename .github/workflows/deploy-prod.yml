# Déploiement automatique de l'API en production.
#
# À chaque push sur main (ou lancement manuel depuis l'onglet Actions), le
# runner auto-hébergé installé SUR LE SERVEUR DE PROD (compte SERVICE RÉSEAU) :
#   1. fait le git pull dans le dossier de prod,
#   2. lance npm install si package.json a changé,
#   3. signale les scripts SQL à appliquer à la main,
#   4. réécrit restart.trigger : PM2 surveille ce seul fichier et redémarre l'API,
#   5. attend qu'elle réponde sur /api/test avec un process neuf.
#
# Le runner n'appelle jamais pm2 : il n'a pas besoin de tourner sous le compte de PM2.
# Mise en place du runner : scripts/install-runner.ps1 (voir DEPLOIEMENT.md).

name: Déploiement prod

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jamais deux déploiements en même temps ; un nouveau push attend la fin du précédent.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    timeout-minutes: 15
    # PROD_DIR vient du fichier .env du runner (écrit par scripts/install-runner.ps1).
    env:
      HEALTH_URL: http://localhost:3001/api/test
    defaults:
      run:
        # Le runner écrit le script en UTF-8 sans BOM et Windows PowerShell 5.1 le lirait
        # en ANSI (accents cassés, « → » lu comme un guillemet) : on le relit en UTF-8.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([IO.File]::ReadAllText('{0}', [Text.Encoding]::UTF8))"
    steps:
      - name: Déployer et vérifier
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $start = Get-Date

          function Show-Logs {
            foreach ($sub in 'errors', 'success') {
              $f = Get-ChildItem "logs\$sub" -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($f) {
                Write-Host "`n--- 40 dernières lignes de logs\$sub\$($f.Name) ---"
                Get-Content $f.FullName -Tail 40 -Encoding UTF8
              }
            }
          }
          function Fail($msg) {
            Write-Host "::error::$msg"
            Show-Logs
            exit 1
          }
          function Get-ApiStatus {
            try {
              return Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 5 -UseBasicParsing
            } catch { return $null }
          }

          if (-not $env:PROD_DIR) { Fail "PROD_DIR non défini : l'ajouter dans le fichier .env du runner (C:\actions-runners\uvcdr-api\.env) puis redémarrer le service." }
          Set-Location $env:PROD_DIR

          # ── 1. Récupération du code ────────────────────────────────
          $before = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { Fail "git ne peut pas lire $env:PROD_DIR (safe.directory ou droits manquants : relancer scripts/install-runner.ps1)." }
          Write-Host "Version actuelle : $(git describe --tags --always) ($before)"

          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { Fail "git pull a échoué (modifications locales sur le serveur ? historique divergent ?)." }

          $after = (git rev-parse HEAD).Trim()
          if ($before -eq $after -and '${{ github.event_name }}' -ne 'workflow_dispatch') {
            Write-Host "✅ Déjà à jour, rien à redémarrer."
            exit 0
          }

          $changed = @(git diff --name-only $before $after)
          Write-Host "`nCommits déployés :"
          git log --oneline "$before..$after"

          # ── 2. Dépendances ─────────────────────────────────────────
          if ($changed -contains 'package.json') {
            Write-Host "`npackage.json a changé → npm install"
            npm.cmd install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { Fail "npm install a échoué." }
          }

          # ── 3. Scripts SQL (jamais appliqués automatiquement) ──────
          $sql = @($changed | Where-Object { $_ -like 'scripts/sql/*' })
          foreach ($f in $sql) { Write-Host "::warning::Script SQL à appliquer sur la base de prod : $f" }

          # ── 4. Redémarrage via le fichier surveillé par PM2 ────────
          $old = Get-ApiStatus
          $oldPid = if ($old -and $old.pid) { $old.pid } else { '?' }
          Write-Host "`nRedémarrage de l'API (PID actuel : $oldPid)..."
          $triggerAt = Get-Date
          Set-Content restart.trigger -Encoding ASCII -Value "$($triggerAt.ToString('s')) $after ${{ github.run_id }}"

          # ── 5. Vérification : process neuf + /api/test répond ──────
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $deadline = (Get-Date).AddSeconds(90)
          $status = $null
          $fresh = $false
          do {
            Start-Sleep -Seconds 3
            $status = Get-ApiStatus
            $fresh = $status -and $status.uptime -le ((Get-Date) - $triggerAt).TotalSeconds + 1
          } until ($fresh -or (Get-Date) -gt $deadline)

          if (-not $status) { Fail "L'API ne répond pas sur $env:HEALTH_URL après redémarrage." }
          if (-not $fresh)  { Fail "L'API n'a pas redémarré (uptime $($status.uptime) s) : PM2 a-t-il été relancé avec ecosystem.prod.config.cjs (watch restart.trigger) ?" }

          Write-Host ""
          Write-Host "✅ API redémarrée (PID $oldPid → $($status.pid))"
          Write-Host "✅ API à jour et en ligne : v$($status.version) [$($status.environment)] — commit $($after.Substring(0,7))"
          if ($status.version -ne $expected) {
            Write-Host "::warning::L'API annonce v$($status.version) alors que package.json indique v$expected."
          }

          # Résumé affiché sur la page du run GitHub
          $summary = @"
          ### ✅ API déployée en production
          | | |
          |---|---|
          | Version | v$($status.version) |
          | Commit | ``$($after.Substring(0,7))`` |
          | PID | $oldPid → $($status.pid) |
          | Durée | $([int]((Get-Date) - $start).TotalSeconds) s |
          "@
          if ($sql.Count) { $summary += "`n`n⚠️ **Scripts SQL à appliquer à la main :**`n" + (($sql | ForEach-Object { "- ``$_``" }) -join "`n") }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
